services:
  backend:
    build: ./Backend
    container_name: jobportal-api
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:@host.docker.internal:5432/jobportal
      

  frontend:
    build: ./frontend
    container_name: jobportal-frontend
    ports:
      - "5173:5173"